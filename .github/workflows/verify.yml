name: Verify backend and Linux image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-lock.txt
      - name: Validate dependencies and deterministic regressions
        run: |
          python -m pip check
          python -B -m unittest discover -s tests -t . -v
          python -B -m scripts.validate_public_cases --offline
      - name: Build production image
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag voltpilot:verify .
      - name: Test actual container without provider spending
        run: python -B -m scripts.container_smoke --image voltpilot:verify